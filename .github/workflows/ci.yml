name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 三平台 matrix 与 development/README.md 的硬性要求对齐
# （"macOS / Linux / Windows 三平台均需通过测试"）
env:
  # 1.22 构建的可执行文件在 2026-09 更新后的 macOS 镜像上无法加载
  # （内核报 "missing LC_UID Load Command" 并以 abort trap 杀掉进程，
  # 测试二进制启动即崩、0.002s FAIL）。升到当前稳定版。
  GO_VERSION: '1.27'

jobs:
  build-test:
    name: build/vet/test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Show toolchain
        run: |
          go version
          git --version

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test -count=1 ./...

  # 格式与行尾门禁。
  #
  # 两条独立防线：
  #   - gofmt：Go 1.19+ 也会重排文档注释缩进，仅靠"看起来没问题"不够
  #   - CRLF 检测：gofmt 只覆盖 .go；.md/.yml/.golden 的行尾需要单独守。
  #     golden 是字节比对对象，CRLF 会让快照永久失配（详见 .gitattributes）
  fmt-check:
    name: gofmt + line-ending check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt -l (must be empty)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: no CRLF in text files (must be empty)
        run: |
          # -I 跳过二进制；-U 关闭"文本模式"以免漏掉 \r
          offenders="$(grep -rlIU $'\r' \
            --include='*.go' --include='*.md' --include='*.yml' \
            --include='*.yaml' --include='*.mod' --include='*.sum' \
            --include='*.json' --include='*.golden' --include='*.sh' \
            . || true)"
          if [ -n "$offenders" ]; then
            echo "::error::CRLF line endings found (must be LF):"
            echo "$offenders"
            exit 1
          fi
          echo "line endings: LF everywhere"

  # 数据竞争检测：涉及 mirror 懒加载与 argparse 的代码在多 goroutine 下有共享状态，
  # 单一 job 跑 -race 即可（-race 需要 cgo，ubuntu 镜像自带 gcc）。
  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race ./...
        run: go test -count=1 -race ./...

  # 阶段可执行验收（每个里程碑一个 TestMXAcceptance）。
  # 验收以 Go 测试实现（cmd/ngm/acceptance_mX_test.go），因此三平台一致可跑：
  #   M1 = Git 层（归一化 / refType / mirror / 凭证纪律）
  #   M2 = archiveDigest（清单格式 / 冻结向量 / CRLF 原样 / LFS·gitlink 拒绝 / content store）
  #   M3 = 依赖图 + 确定性 lock（传递依赖 / root wins / 冲突 / 可复现 lock / install 尊重 lock）
  #   M4 = vendor 4 层 + mappings（link tree / linkMode 矩阵 / 全量哈希一致 / mappings 校验）
  #   M5 = verify（三级检查 / 漂移分类 / 退出码矩阵 / 离线快照 / 内容去重不误报）
  #   M6 = adapter 与构建命令（清单 / argv 翻译 / 回退 / self stub / engines 命令）
  #   M7 = 端到端验收（quickstart 全流程：init → add → install → verify → build）
  acceptance:
    name: acceptance M1–M7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: run milestone acceptance
        # v0.2 起验收测试改按版本分组命名，这里一并列出——只跑 M1–M7 会让
        # 后续版本的端到端验收"在 CI 里存在但从不显式执行"，红灯时也看不出是哪一组。
        run: go test -count=1 -run 'TestM1Acceptance|TestM2Acceptance|TestM3Acceptance|TestM3LockGoldenShape|TestM4Acceptance|TestM5Acceptance|TestM6Acceptance|TestM7Quickstart$|TestV02SupplyChainAcceptance|TestV02ObservabilityAcceptance|TestV03MappingsMonorepoAcceptance|TestV03IntegrationsAcceptance|TestV03PermissionsAcceptance|TestV03CredentialDiscipline|TestV03SandboxAcceptance|TestV03PostInstallAcceptance|TestV03AuditHookAcceptance|TestV03WasmEngineAcceptance' -v ./cmd/ngm

  # 真实引擎集成（M6）：hermetic 那一组用假引擎覆盖协议，这里用**真实的 esbuild**
  # 证明 adapter 与真工具的对接确实成立——包括把 ngm.mappings.json 变成
  # `--alias:` 让裸导入 `github:org/repo` 解析进 ngm.vendor。
  #
  # 为什么不并进上面那组：那组必须**离线、无外部工具**才能在任意机器上复现；
  # 混进来会让它在没装 esbuild 的机器上被静默跳过，验收变成假象。
  engine-adapter:
    name: engine integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          # 与文档声明的宿主运行时下限（Node >= 22，见 guides/installation.md）保持一致。
          # 用 20 来测等于在测一个我们并不支持的环境——声明的下限就从未被验证过。
          node-version: '22'
      - name: install real engines
        # tsc 与 postcss 自 v0.2 起是内置引擎，但它们的**真实**兼容性此前
        # 从未被 CI 证明过（假引擎会接受任何参数，真实工具不会）。
        run: npm install --global esbuild typescript postcss-cli postcss
      - uses: denoland/setup-deno@v2
        with:
          # 不钉版本：沙箱按**能力**探测（--allow-read=<dir> 与 --deny-*），
          # 写死版本号会在能跑的版本上拒绝运行、在不能跑的版本上放行（ADR-012 决策 6）。
          deno-version: v1.x
      - name: show deno version
        run: deno --version
      - name: show engine versions
        run: |
          esbuild --version
          tsc --version
          postcss --version
      - name: real engine acceptance
        # TestV03IntegrationsRealTools 在这里而不是 hermetic 组：它要真的跑
        # esbuild 打包与 tsc 类型检查——那正是"生成的配置能用"的唯一证明。
        # TestV03SandboxRealDeno 同理：沙箱的逃逸阻断只有真 Deno 能证明。
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -run 'TestM6Acceptance_RealEsbuild|TestM7Quickstart_RealToolchain|TestV02RealTsc|TestV02RealPostcss|TestV03IntegrationsRealTools|TestV03SandboxRealDeno|TestV03PostInstallRealDeno|TestV03AuditHookRealDeno' -v ./cmd/ngm | tee real-engine.log
          # 本 job 明确装了 esbuild / typescript / postcss，因此任何 skip 都说明
          # 环境没装配好。不检查的话，"工具缺失 → 全部 skip → CI 绿"会让整份
          # 真工具验收变成假象——绿的是空集，而不是通过。
          if grep -qE '^\s*--- SKIP' real-engine.log; then
            echo "::error::a real-engine test was skipped; this job installs the tools, so the environment is wrong"
            grep -E '^\s*--- SKIP' real-engine.log
            exit 1
          fi

  # 文档链接检查：仅当 docs/ 目录存在时启用。
  # M0 阶段 docs/ 是空仓；ngm-doc 文档暂未合并进来。
  # 一旦 ngm-doc 进入本仓（或以 submodule 引入），本任务自动启用。
  docs-links:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs links (bash)
        shell: bash
        run: |
          if [ -d docs ]; then
            bash scripts/check-docs-links.sh docs
          else
            echo "no docs/ directory yet; will be enabled after ngm-doc merge"
          fi

  # lock 字节可复现回归（M3 起生效）。
  # 这条纪律是 v0.1 的退出标准之一，因此独立成一个 job（而不是混在 acceptance 里
  # 被一长串 -run 表达式掩盖）。同一 ngm.json + 同一上游状态 → 除 resolvedAt 外
  # 字节级一致。
  lock-reproducibility:
    name: lock byte reproducibility (M3+)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: two installs must agree modulo resolvedAt
        run: go test -count=1 -run 'TestM3Acceptance/lock_is_reproducible' -v ./cmd/ngm