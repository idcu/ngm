name: Release

# 打 tag 即发布：产物命名与校验文件见 guides/installation.md。
on:
  push:
    tags: ['v*']

  # 手动补发入口（v0.8 收尾时加的，因为它真的需要过）。
  #
  # 为什么需要：**镜像把 tag 推到 GitHub，并不保证触发这里的 `push` 事件**。
  # 实测 2026-10-02：`v0.5.0` ~ `v0.8.0` 四个 tag 已经出现在 GitHub 上
  # （`git ls-remote` 可见、附注对象完整），但本工作流**一次都没跑**
  # （`/actions/workflows/370079274/runs` 只有 v0.1.0 ~ v0.4.0 四次），
  # 而同一时段的分支推送照常触发 CI。没有这条入口时，补发只能靠
  # "删掉 tag 再推一次"去赌同一条路径——而它刚刚证明不可靠。
  #
  # 用法：Actions → Release → Run workflow，填入**已存在**的 tag（例如 `v0.8.0`）。
  # 那条路径与 tag 推送的产物完全一致：同一个 tag 上跑同一段脚本、同一组断言。
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v0.8.0）'
        required: true
        type: string

# 创建 release 需要写权限（默认的 GITHUB_TOKEN 在 tag 事件下是只读的）
permissions:
  contents: write

env:
  # 与 ci.yml 保持一致：旧工具链构建的 macOS 二进制在新内核上无法加载，
  # 发布产物必须用能通过三平台验收的同一版本构建。
  GO_VERSION: '1.27'
  GOPRIVATE: gitee.com/idcu-go/*
  GONOSUMDB: gitee.com/idcu-go/*

jobs:
  # 发布前的全量测试必须覆盖三个平台：只测 Ubuntu 时，"Windows/macOS 上绿"
  # 是 CI 分支的结论，不是即将发布那份产物的结论（S2-14）。
  test:
    name: pre-release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build + vet
        run: |
          go build ./...
          go vet ./...
      - name: full test suite
        run: go test -count=1 -timeout 40m ./...

  release:
    name: build and publish assets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      # 先定下"要发布哪个 tag"：tag 推送时就是 GITHUB_REF_NAME，
      # 手动触发时来自输入（**先过一遍 env，不要直接插进 run 脚本里**）。
      - name: resolve the tag to release
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            name="${DISPATCH_TAG}"
          else
            name="${GITHUB_REF_NAME}"
          fi
          if [ -z "${name}" ]; then
            echo "::error::no tag to release (empty)"
            exit 1
          fi
          # 只接受 v<semver>（含 -rc/-dev 后缀）。旧写法 `case v*` 会放行
          # `vfoo`，而它一旦进入 release 就会污染 latest 与附件命名（S2-14）。
          if ! printf '%s' "${name}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag must look like vX.Y.Z(-suffix), got '${name}'"
            exit 1
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "releasing ${name}"

      - uses: actions/checkout@v4
        with:
          # 取全量历史：build-release.sh 用 `git rev-parse --short HEAD` 注入短哈希，
          # 浅克隆下这个值会是错的（甚至是空的）。
          fetch-depth: 0
          # 手动触发时默认取的是分支；显式指向那个 tag，两条路径才是同一份源码。
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure Gitee module access
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "${GITEE_TOKEN}" ]; then
            git config --global url."https://oauth2:${GITEE_TOKEN}@gitee.com/".insteadOf "https://gitee.com/"
          else
            echo "GITEE_TOKEN is not set; assuming the Gitee module is public"
          fi

      - name: go mod download
        run: go mod download

      # 发布前先跑测试：产物一旦推出去就是可下载的二进制，绕过验收直接发布
      # 等于把 v0.1 的退出标准交给运气。
      #
      # 超时与 ci.yml 保持一致（40m 而非默认 10m）：`cmd/ngm` 有 97 个顶层测试
      # 函数，在 Windows 上串行会超过默认上限——**让"慢"读成"坏"**，
      # 而这一版的产物正是最不该被误伤发布的东西。
      - name: test before packaging
        run: go test -count=1 -timeout 40m ./...

      # bash 显式调用而不是 ./script：Windows 上创建的脚本文件没有可执行位，
      # 提交到 git 后 checkout 出来仍是 100644，直接执行会 permission denied。
      #
      # BUILT 固定为 tag 的提交时间（不是"现在"）：同一 tag 的重建因此只有
      # toolchain 一个变量，而不是每次多一个时间戳。
      - name: build artifacts
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${TAG#v}"   # v0.1.0 -> 0.1.0（--version 不带 v 前缀）
          built="$(git log -1 --format=%cI HEAD)"
          VERSION="$version" COMMIT="$(git rev-parse --short HEAD)" BUILT="$built" \
            bash scripts/build-release.sh

      - name: verify the artifacts before publishing
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cd dist
          # 校验和必须能被消费方原样验证；这是发布前最后一道"字节对不对"的判据。
          sha256sum -c SHA256SUMS
          test -x ngm-linux-amd64
          ./ngm-linux-amd64 --version | grep -F "ngm ${version} (git:" >/dev/null
          # 版本化别名与既有名字必须同一份字节（同一构建的复制，不是第二套构建）。
          cmp ngm-linux-amd64 "ngm-${version}-linux-amd64"
          test -f "ngm-${version}-windows-amd64.exe"
          echo "artifacts verified for ${TAG}"

      - name: release notes from CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          bash scripts/release-notes.sh "$TAG" --out "$RUNNER_TEMP/release-notes.md"

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          extra=""
          case "$version" in
            *-*) extra="--prerelease" ;;   # 0.102.0-dev.1 这类开发版不进 latest
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 补发/重跑：更新说明并覆盖同名附件，绝不创建第二份 release。
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" $extra
            gh release upload "$TAG" dist/ngm-* dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" $extra \
              dist/ngm-* dist/SHA256SUMS
          fi

  # Gitee 是可选通道。**先 gate、再上传**：缺变量/缺 token 时 gate 在 summary
  # 里写明缺什么，上传 job 显示 skipped；有凭据时上传失败就是失败，没有
  # continue-on-error 把它糊过去。
  gitee-gate:
    name: Gitee channel gate
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: explain skip or enable
        id: gate
        shell: bash
        env:
          GITEE_UPLOAD: ${{ vars.GITEE_UPLOAD }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ "$GITEE_UPLOAD" != "true" ]; then
            echo '**Gitee skipped** — repository variable `GITEE_UPLOAD` is not `true`.' >> "$GITHUB_STEP_SUMMARY"
            echo "Gitee skipped: GITEE_UPLOAD != true"
            exit 0
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo '**Gitee skipped** — secret `GITEE_TOKEN` is empty.' >> "$GITHUB_STEP_SUMMARY"
            echo "Gitee skipped: GITEE_TOKEN is empty"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo 'Gitee channel enabled — the same GitHub bytes will be uploaded.' >> "$GITHUB_STEP_SUMMARY"

  gitee-assets:
    name: mirror the same assets to Gitee (optional)
    needs: [release, gitee-gate]
    if: needs.gitee-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 先下载 GitHub 上已经发布的字节：两个源必须是同一份字节，Gitee 侧
      # 不重新构建，也不从本机产物复制。
      - name: download the published GitHub assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --dir dist

      - name: upload and verify on Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/gitee-release.sh --tag "$TAG" --assets dist
