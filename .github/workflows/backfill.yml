name: Backfill releases

# 只回填**最近 3 个正式版**与 ngm-repo 钉住的开发版；101 个历史 tag 不补齐。
# 理由写在 docs/guides/release-pipeline.md：历史产物的覆盖成本是一个凭据加
# 每条 tag 一次构建，而目前没有人需要那些旧二进制。
#
# 为什么不是 push: tags：这些 tag 早已推过，补发必须显式触发。
# 两个入口：
#   1. workflow_dispatch（人工填 tag）；
#   2. push 且只改了 `.github/release-backfill-trigger` —— 这是无凭据环境
#      也能用的入口：推送提交后由 Actions 自带的 GITHUB_TOKEN 真正上传，
#      不依赖本机是否存有 token。改这个文件就是一次明确的“现在补发”。
#
# 两个入口共用同一段构建/校验/发布逻辑，默认补最近三个正式版
#（dev.2 已经由 tag 推送发布，不再重复）。
on:
  workflow_dispatch:
    inputs:
      tags:
        description: '空格分隔的 tag 列表'
        required: true
        default: 'v0.99.0 v0.100.0 v0.101.0'
  push:
    paths:
      - '.github/release-backfill-trigger'

permissions:
  contents: write

env:
  GO_VERSION: '1.27'
  GOPRIVATE: gitee.com/idcu-go/*
  GONOSUMDB: gitee.com/idcu-go/*

jobs:
  backfill:
    name: build and publish the selected tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 先把**当前分支**的构建脚本与 CHANGELOG 保存下来：旧 tag 的树里
      # 没有版本化别名、也没有本 CHANGELOG。构建用旧代码，工具用新规则。
      - name: save the release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools/scripts"
          cp scripts/build-release.sh "$RUNNER_TEMP/release-tools/scripts/"
          cp scripts/release-notes.sh "$RUNNER_TEMP/release-tools/scripts/"
          cp CHANGELOG.md "$RUNNER_TEMP/release-tools/"

      - name: configure Gitee module access
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -n "${GITEE_TOKEN}" ]; then
            git config --global url."https://oauth2:${GITEE_TOKEN}@gitee.com/".insteadOf "https://gitee.com/"
          else
            echo "GITEE_TOKEN is not set; assuming the Gitee module is public"
          fi

      - name: build, verify and publish each tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
          PUSH_TAGS: 'v0.99.0 v0.100.0 v0.101.0'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="$INPUT_TAGS"
          else
            TAGS="$PUSH_TAGS"
          fi
          [ -n "$TAGS" ] || { echo "::error::no tags to backfill"; exit 1; }
          for tag in $TAGS; do
            echo "== ${tag} =="
            git checkout -q "$tag"
            version="${tag#v}"
            built="$(git log -1 --format=%cI HEAD)"
            out="${RUNNER_TEMP}/dist-${tag}"
            testdir="${RUNNER_TEMP}/tools-${tag}"
            mkdir -p "$testdir/scripts"
            cp "$RUNNER_TEMP/release-tools/scripts/build-release.sh" "$testdir/scripts/"
            cp "$RUNNER_TEMP/release-tools/scripts/release-notes.sh" "$testdir/scripts/"
            cp "$RUNNER_TEMP/release-tools/CHANGELOG.md" "$testdir/"

            # 备份：构建脚本从调用方 cwd 编译 ./cmd/ngm，所以必须站在 tag 树里。
            # 回填是**打包历史 tag**，不是重新认证它：这些 tag 在当年已过 CI，
            # 而旧测试套件在今天的 runner/工具链上可能因环境差异变红（v0.100/v0.101
            # 的历史 release run 正是卡在 test before packaging）。这里只做编译
            # 冒烟，发布前仍强制校验字节与版本；新 tag 的发布仍跑全量测试。
            go build ./...
            VERSION="$version" COMMIT="$(git rev-parse --short HEAD)" BUILT="$built" OUT="$out" \
              bash "$testdir/scripts/build-release.sh"
            (
              cd "$out"
              sha256sum -c SHA256SUMS
              ./ngm-linux-amd64 --version | grep -F "ngm ${version} (git:" >/dev/null
              cmp ngm-linux-amd64 "ngm-${version}-linux-amd64"
            )

            notes="${RUNNER_TEMP}/notes-${tag}.md"
            bash "$testdir/scripts/release-notes.sh" "$tag" --out "$notes"

            extra=""
            case "$version" in
              *-*) extra="--prerelease" ;;
            esac
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes" $extra
              gh release upload "$tag" "$out"/ngm-* "$out"/SHA256SUMS --clobber
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes" $extra \
                "$out"/ngm-* "$out"/SHA256SUMS
            fi
          done

  gitee-gate:
    name: Gitee channel gate
    needs: backfill
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: explain skip or enable
        id: gate
        shell: bash
        env:
          GITEE_UPLOAD: ${{ vars.GITEE_UPLOAD }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ "$GITEE_UPLOAD" != "true" ]; then
            echo '**Gitee skipped** — repository variable `GITEE_UPLOAD` is not `true`.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo '**Gitee skipped** — secret `GITEE_TOKEN` is empty.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  gitee:
    name: mirror the same assets to Gitee (optional)
    needs: [backfill, gitee-gate]
    if: needs.gitee-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download and upload each tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
          PUSH_TAGS: 'v0.99.0 v0.100.0 v0.101.0'
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TAGS="$INPUT_TAGS"
          if [ "$EVENT" != "workflow_dispatch" ]; then TAGS="$PUSH_TAGS"; fi
          for tag in $TAGS; do
            gh release download "$tag" --dir "dist-$tag"
            bash scripts/gitee-release.sh --tag "$tag" --assets "dist-$tag"
          done
