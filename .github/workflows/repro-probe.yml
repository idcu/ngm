# 可复现构建探针 —— **手动触发**（`workflow_dispatch`），不随推送运行。
#
# 它回答的问题：[ADR-013](../docs/adr/adr-013-remote-adapter.md) 的翻案条件之一
# ——"同一份源码 + 同一引擎版本 → 相同字节"，到底成不成立。
# 这个问题是跨平台的，而 Actions 日志匿名读不到，因此结果以 annotation 形式发出
# （手法来自 v0.2 复盘：把失败/结果经 `::error::` / `::notice::` 发到 annotations）。
#
# 已实测（2026-10-01，esbuild 0.28.2，极简用例：单文件 + 单依赖）：
#   - `--minify`：三平台 × 两个不同路径，**六次构建字节全同**
#   - 不 minify：跨平台同路径一致
#   - 不 minify 且传**绝对路径**：字节不同（产物注释里嵌的是传入的路径）
# 结论与保留见 ADR-013 的"第一条的实测进展"一节。
#
# 要扩展时改这一段即可：换引擎（tsc / postcss）、加多文件 / sourcemap / 外部依赖，
# 看哈希是否仍然跨平台一致。**注意**：结果行必须保持"一行摘要"，
# 否则会被每步的 annotation 条数上限挤掉——那是这份文件第三次迭代才修好的问题。
name: repro-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: probe
        shell: bash
        run: |
          set +e
          ESB="npx --yes esbuild@0.28.2"
          # 依赖用显式文件名导入：实测 esbuild 对**相对目录**导入（`./lib`）不做
          # `index.ts` 解析，三平台一致地报 Could not resolve。
          mkdir -p work/a/src work/b/src
          for d in a b; do
            printf 'export const x: number = 41 + 1;\n' > "work/$d/src/lib.ts"
            printf 'import { x } from "./lib.ts";\nconsole.log(x);\n' > "work/$d/src/index.ts"
          done

          $ESB --bundle work/a/src/index.ts --minify --outfile=work/a/min.js > b1.log 2>&1
          c1=$?
          $ESB --bundle work/b/src/index.ts --minify --outfile=work/b/min.js > b2.log 2>&1
          c2=$?
          $ESB --bundle work/a/src/index.ts --outfile=work/a/plain.js > b3.log 2>&1
          c3=$?

          h() { node -e "const c=require('crypto'),f=require('fs');process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex').slice(0,16))" "$1" 2>/dev/null; }
          mins_a=$(h work/a/min.js)
          mins_b=$(h work/b/min.js)
          plain_a=$(h work/a/plain.js)
          # 产物里是否嵌了构建机的路径（1 = 嵌了）
          pathleak=$(grep -c 'work/a/src/lib.ts' work/a/plain.js 2>/dev/null)
          minleak=$(grep -c 'work/a/src/lib.ts' work/a/min.js 2>/dev/null)

          echo "::notice::PROBE ${{ runner.os }} exit=$c1/$c2/$c3 min_a=$mins_a min_b=$mins_b plain_a=$plain_a pathleak=${pathleak:-?} minleak=${minleak:-?}"

          # 探针失败时必须自己说出来：一个不能报告自己失败的探针等于没跑
          # （这份文件的前两版就是这样，而我把"空结果"读成了结果）。
          if [ "$c1" != "0" ] || [ "$c2" != "0" ] || [ "$c3" != "0" ]; then
            for f in b1.log b2.log b3.log; do
              if [ -s "$f" ]; then
                head -4 "$f" | while IFS= read -r line; do
                  echo "::notice::PROBE ${{ runner.os }} log($f) | $line"
                done
              fi
            done
          fi
