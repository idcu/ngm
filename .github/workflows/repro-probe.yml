# 可复现构建探针。
#
# 触发方式：**编辑本文件或探针脚本即跑一次**（`push` 限定在这两个路径），或手动触发。
# 这样"改仪器"与"看结果"是同一个动作——而不是改完之后忘了跑它。
#
# 它回答的问题：[ADR-013](../docs/adr/adr-013-remote-adapter.md) 的翻案条件之一：
# **"同一份源码 + 同一引擎版本 → 相同字节"**到底成立到什么程度。
#
# 测量逻辑集中在 `scripts/probe-reproducibility.sh`，本工作流只是**在三个平台上各跑一次**。
# 结果以 annotation 的形式发出（Actions 日志匿名读不到——手法见 v0.2 复盘）。
#
# ## 读法
#
# 结果行形如：
#
#	PROBE <os> esbuild=<v> tsc=<v> treeA=<hash> treeB=<hash> ctrl=<hash>
#	      same_across_paths=yes ctrl_sensitive=sensitive verdict=REPRODUCIBLE fails=
#
#   - `treeA` / `treeB`：同一份源码在**两个不同目录名**下各自构建的产物树哈希；
#     两者相同 = 路径无关。
#   - `ctrl`：只改了一个源文件的一个字节之后重新构建的哈希。
#     **它必须与 treeA 不同**——否则说明这个检查坏了（永远返回同一个值），
#     前面的"相同"就什么都没有证明。
#   - `verdict`：上面两条都成立才是 `REPRODUCIBLE`。
#
# 跨平台的比较由读结果的人做：三个平台的 `treeA`（`=treeB`）互相一样，
# 才说明**跨机器**也能复现。

name: repro-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repro-probe.yml'
      - 'scripts/probe-reproducibility.sh'

jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: measure
        shell: bash
        run: bash scripts/probe-reproducibility.sh "${{ runner.os }}"
